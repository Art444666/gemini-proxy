name: proxy-tunnel

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-tunnel
  cancel-in-progress: true

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TUNNEL_FILE: tunnel.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start proxy
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > proxy.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          echo

      - name: Start tunnel
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate > cf.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then echo "tunnel failed"; tail -n 40 cf.log; exit 1; fi
          echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS "$URL/healthz"; then echo; break; fi
            sleep 2
          done

      - name: Publish URL
        run: |
          git config user.name "proxy-tunnel"
          git config user.email "proxy-tunnel@users.noreply.github.com"
          printf '%s\n' "$TUNNEL_URL" > "$TUNNEL_FILE"
          git add "$TUNNEL_FILE"
          git commit -m "tunnel url: $TUNNEL_URL" || true
          git push || true

      - name: Keep alive
        run: |
          echo "serving $TUNNEL_URL"
          sleep 20000
